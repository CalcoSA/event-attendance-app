name: event-attendance-app

# Docker Compose >= 2.30.0 (env_file con format: raw).
# MySQL es externo y ya existe. No se define un servicio de base de datos.
services:
  backend:
    image: ${BACKEND_IMAGE:-event-attendance-backend:local}
    build:
      context: .
      target: backend
    env_file:
      - path: ${BACKEND_ENV_PATH:-.env.production}
        format: raw
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
  image: ${FRONTEND_IMAGE:-event-attendance-frontend:local}
  build:
    context: .
    target: frontend

  ports:
    - "127.0.0.1:8089:8080"

  depends_on:
    backend:
      condition: service_healthy

  restart: unless-stopped

  security_opt:
    - no-new-privileges:true

  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:8080/healthz"
      ]
    interval: 20s
    timeout: 8s
    retries: 3
    start_period: 30s

  stop_grace_period: 20s

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"


